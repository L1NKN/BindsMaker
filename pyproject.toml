[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bindsmaker"
version = "0.1.0"
description = "Find keyboard shortcuts that no other app is using."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
bindsmaker = "bindsmaker.cli:main"

[project.gui-scripts]
bindsmaker-gui = "bindsmaker.gui:main"

[tool.setuptools]
packages = ["bindsmaker"]

[tool.setuptools.package-data]
bindsmaker = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
